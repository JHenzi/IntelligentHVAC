# =============================================================================
# Intelligent HVAC — Comfort Package
# =============================================================================
# The helpers, template sensors, script and automations that turn the learned
# thermal model into "wake up to a warm house".
#
#   You set:  "I want 70°F at 7:00 AM"
#   It does:  works out how long the house needs to recover from the nighttime
#             setback (using the learned model) and starts heating exactly
#             then — no earlier, no later.
#
# REQUIRES the Intelligent HVAC integration to be installed and configured.
#
# INSTALL (see packages/README.md for details):
#   1. Enable packages in configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   2. Copy this file to <config>/packages/
#   3. Find & replace the entity IDs below if yours differ:
#        climate.thermostat   -> your thermostat
#        weather.home         -> your weather entity (daily forecast support)
#        sensor.intelligent_hvac_time_to_target_5degf_heat / _cool -> Intelligent HVAC sensors
#   4. Restart Home Assistant.
# =============================================================================

# -----------------------------------------------------------------------------
# Helpers
# -----------------------------------------------------------------------------
input_datetime:
  target_wake_up_time:
    name: Target Wake-up Time
    has_date: false
    has_time: true
    icon: mdi:alarm
  smart_recovery_start_time:
    name: Smart Recovery Start Time
    has_date: false
    has_time: true
    icon: mdi:clock-start

input_number:
  target_temperature:
    name: Target Temperature
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer
  recovery_time_buffer:
    name: Recovery Time Buffer
    min: 0
    max: 60
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-outline
  fallback_recovery_lead:
    # Lead used when the model has no usable answer (sensor unavailable or
    # implausible). ~90 min suits most homes recovering 5°F. Set it on first run.
    # It does NOT floor the model: a fast house is allowed to start later.
    name: Fallback Recovery Lead
    min: 30
    max: 240
    step: 5
    unit_of_measurement: min
    icon: mdi:shield-check
  max_recovery_lead:
    # Never start heat-up earlier than this before wake-up (caps a bad model).
    name: Maximum Recovery Lead
    min: 60
    max: 360
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-alert-outline
  nighttime_setback_temperature:
    name: Nighttime Setback Temperature
    min: 55
    max: 75
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-low
  moderate_cold_setback_temperature:
    name: Moderate Cold Setback Temperature
    min: 55
    max: 75
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-minus
  extreme_cold_setback_temperature:
    name: Extreme Cold Setback Temperature
    min: 55
    max: 75
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-alert
  moderate_cold_threshold:
    name: Moderate Cold Threshold
    min: -20
    max: 50
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
  extreme_cold_threshold:
    name: Extreme Cold Threshold
    min: -20
    max: 40
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-alert
  forecast_cool_above:
    name: Switch to Cool When Forecast High Above
    min: 60
    max: 100
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
  forecast_heat_below:
    name: Switch to Heat When Forecast High Below
    min: 30
    max: 75
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:fire
  # Calculated values (written by the script below; shown on the dashboard)
  current_recovery_time:
    name: Heat-up Time per 5°F
    min: 0
    max: 300
    step: 1
    unit_of_measurement: min
    icon: mdi:timer
  temperature_delta:
    name: Temperature Delta
    min: 0
    max: 20
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
  scaled_recovery_time:
    name: Heat-up Lead Before Wake
    min: 0
    max: 300
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-sand

# -----------------------------------------------------------------------------
# Template sensors
# -----------------------------------------------------------------------------
# Live indoor trend (°F/h) over the last hour. The smart start uses it to see
# how fast the house is actually coasting down tonight, since the learned
# heat-loss coefficient can badly understate overnight losses.
sensor:
  - platform: derivative
    source: sensor.intelligent_hvac_learned_indoor_temperature
    name: Intelligent HVAC Indoor Trend
    unique_id: ihvac_indoor_trend
    unit_time: h
    time_window: "01:00:00"
    round: 2

template:
  - sensor:
      - name: Outdoor Temperature Most Recent
        unique_id: outdoor_temperature_most_recent
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        # Prefers a dedicated outdoor sensor, falls back to your weather entity.
        # EDIT the two entity IDs below.
        state: >
          {% set sensor_temp = states('sensor.my_outdoor_temperature') | float(none) %}
          {% set weather_temp = state_attr('weather.home', 'temperature') | float(none) %}
          {{ sensor_temp if sensor_temp is not none else weather_temp }}
        availability: >
          {% set sensor_temp = states('sensor.my_outdoor_temperature') | float(none) %}
          {% set weather_temp = state_attr('weather.home', 'temperature') | float(none) %}
          {{ sensor_temp is not none or weather_temp is not none }}
  - binary_sensor:
      - name: Outdoor Temperature Below Extreme Cold Threshold
        unique_id: outdoor_temp_below_extreme_cold
        device_class: cold
        state: >
          {{ states('sensor.outdoor_temperature_most_recent') | float(99)
             < states('input_number.extreme_cold_threshold') | float(15) }}
      - name: Outdoor Temperature Below Moderate Cold Threshold
        unique_id: outdoor_temp_below_moderate_cold
        device_class: cold
        state: >
          {{ states('sensor.outdoor_temperature_most_recent') | float(99)
             < states('input_number.moderate_cold_threshold') | float(32) }}

# -----------------------------------------------------------------------------
# Script: the one place the recovery math lives
# -----------------------------------------------------------------------------
script:
  intelligent_hvac_update_recovery:
    alias: Intelligent HVAC - Update Recovery Calculations
    description: >-
      Predicts the indoor temperature at heat-up time (passive decay toward the
      outdoor temperature, floored at the thermostat's actual setpoint), works
      out how long heating from there to the target takes, and sets the start
      time. Re-run every 5 minutes overnight so it tracks the house; once the
      start is within the commit window it stops changing (and if the house
      has cooled faster than expected and the start is already due, it heats now).
    mode: single
    max_exceeded: silent
    sequence:
      - variables:
          commit_min: 15
          outdoor: "{{ states('sensor.outdoor_temperature_most_recent') | float(32) }}"
          target: "{{ states('input_number.target_temperature') | float(70) }}"
          sp_raw: "{{ state_attr('climate.thermostat', 'temperature') }}"
          # Where the thermostat will hold the house overnight. Use the real
          # setpoint when heating; otherwise the configured setback.
          floor_temp: >-
            {% if is_state('climate.thermostat', 'heat') and sp_raw is number %}{{ sp_raw | float }}
            {% elif outdoor < states('input_number.extreme_cold_threshold') | float(15) %}{{ states('input_number.extreme_cold_setback_temperature') | float(68) }}
            {% elif outdoor < states('input_number.moderate_cold_threshold') | float(32) %}{{ states('input_number.moderate_cold_setback_temperature') | float(67) }}
            {% else %}{{ states('input_number.nighttime_setback_temperature') | float(65) }}{% endif %}
          indoor: >-
            {{ states('sensor.intelligent_hvac_learned_indoor_temperature')
               | float(state_attr('climate.thermostat', 'current_temperature') | float(floor_temp)) }}
          base: "{{ states('sensor.intelligent_hvac_time_to_target_5degf_heat') | float(0) }}"
          k_model: "{{ state_attr('sensor.intelligent_hvac_time_to_target_5degf_heat', 'heat_loss_per_hour') | float(0) }}"
          # Observed loss coefficient from the live trend, only while coasting
          # (heat idle, house falling, meaningfully warmer than outside).
          k_obs: >-
            {% set tr = states('sensor.intelligent_hvac_indoor_trend') | float(0) %}
            {% if tr < -0.1 and indoor - outdoor > 3 and state_attr('climate.thermostat', 'hvac_action') != 'heating' %}
              {{ [-tr / (indoor - outdoor), 0.3] | min }}
            {% else %}0{% endif %}
          k: "{{ [k_model | float, k_obs | float] | max }}"
          power: "{{ state_attr('sensor.intelligent_hvac_time_to_target_5degf_heat', 'heating_power_f_per_hour') | float(0) }}"
          model_ok: "{{ 5 <= base | float <= 300 }}"
          buffer: "{{ states('input_number.recovery_time_buffer') | float(5) }}"
          fallback_lead: "{{ states('input_number.fallback_recovery_lead') | float(90) }}"
          max_lead: "{{ states('input_number.max_recovery_lead') | float(240) }}"
          wake_dt: >-
            {% set w = states('input_datetime.target_wake_up_time') %}
            {% set d = today_at(w if w not in ['unknown', 'unavailable'] else '07:00:00') %}
            {{ (d if d > now() else d + timedelta(days=1)).isoformat() }}
          mins_to_wake: "{{ ((as_datetime(wake_dt) - now()).total_seconds() / 60) | round(1) }}"
          # Fixed point: lead -> predicted temp at start -> heat-up time -> lead.
          plan: >-
            {% set ns = namespace(lead=60.0, ts=floor_temp | float, heat=0.0) %}
            {% for i in range(10) %}
              {% set hrs = [mins_to_wake | float - ns.lead, 0] | max / 60 %}
              {% set ts = outdoor + (indoor - outdoor) * (e ** (-(k | float) * hrs)) if k | float > 0 else indoor %}
              {% set ts = [[ts, indoor] | min, floor_temp | float] | max %}
              {% set need = target | float - ts %}
              {% if need <= 0 %}{% set heat = 0 %}
              {% else %}
                {% set num = power | float - k | float * (ts - outdoor) %}
                {% set den = power | float - k | float * (target | float - outdoor) %}
                {% if k | float > 0 and power | float > 0 and den > 0 and num > den %}
                  {% set heat = 60 / (k | float) * log(num / den) %}
                {% else %}
                  {% set heat = base | float * need / 5 %}
                {% endif %}
              {% endif %}
              {% set new = [heat + buffer | float, max_lead | float] | min %}
              {% set ns.lead = (ns.lead + new) / 2 if i < 9 else new %}
              {% set ns.ts = ts %}{% set ns.heat = heat %}
            {% endfor %}
            {% set lead = ns.lead if model_ok else fallback_lead | float %}
            {{ {'lead': lead | round(0), 'start_temp': ns.ts | round(1), 'heat': ns.heat | round(1),
                'delta': [target | float - ns.ts, 0] | max | round(1)} }}
          new_start: "{{ (as_datetime(wake_dt) - timedelta(minutes=plan.lead | float)).isoformat() }}"
          # The start already committed for this wake-up (if any).
          old_start: >-
            {% set s = states('input_datetime.smart_recovery_start_time') %}
            {% if s in ['unknown', 'unavailable', ''] %}{{ none }}{% else %}
              {% set d = as_datetime(wake_dt).replace(hour=today_at(s).hour, minute=today_at(s).minute, second=0) %}
              {{ (d if d <= as_datetime(wake_dt) else d - timedelta(days=1)).isoformat() }}
            {% endif %}
          # Committed: the existing start is within commit_min (or past) for this
          # wake-up. Stop moving it; the morning/fallback automations take it from here.
          locked: >-
            {{ old_start is not none
               and as_datetime(old_start) - timedelta(minutes=commit_min) <= now()
               and as_datetime(old_start) > as_datetime(wake_dt) - timedelta(minutes=max_lead | float + 1) }}
      - condition: template
        value_template: "{{ not locked }}"
      - action: input_number.set_value
        target: { entity_id: input_number.current_recovery_time }
        data: { value: "{{ [base | float, 300] | min if model_ok else 0 }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.temperature_delta }
        data: { value: "{{ [plan.delta | float, 20] | min }}" }
      - action: input_number.set_value
        target: { entity_id: input_number.scaled_recovery_time }
        data: { value: "{{ [plan.lead | float, 300] | min }}" }
      - action: input_datetime.set_datetime
        target: { entity_id: input_datetime.smart_recovery_start_time }
        data:
          time: "{{ as_datetime(new_start).strftime('%H:%M:00') }}"
      # Already due (house cooled faster than predicted): heat now, don't skip.
      - if:
          - condition: template
            value_template: >-
              {{ as_datetime(new_start) <= now()
                 and is_state('climate.thermostat', 'heat')
                 and sp_raw is number and sp_raw | float < target | float - 0.5 }}
        then:
          - action: climate.set_temperature
            target: { entity_id: climate.thermostat }
            data: { temperature: "{{ target }}" }

# -----------------------------------------------------------------------------
# Automations
# -----------------------------------------------------------------------------
automation:
  # Midnight: pick the season's mode from today's forecast.
  - id: ihvac_set_mode_by_forecast
    alias: Set HVAC Mode Based on Daily Forecast
    description: >-
      Each midnight, read today's forecast high. Above the "cool" threshold ->
      cool; below the "heat" threshold -> heat; in between -> leave alone.
    triggers:
      - trigger: time
        at: "00:00:00"
    conditions:
      # Skip quietly (instead of erroring) when the weather entity is down.
      - condition: template
        value_template: "{{ states('weather.home') not in ['unknown', 'unavailable'] }}"
    actions:
      - action: weather.get_forecasts
        target: { entity_id: weather.home }
        data: { type: daily }
        response_variable: forecast
        continue_on_error: true
      - variables:
          days: "{{ ((forecast | default({})).get('weather.home', {})).get('forecast', []) }}"
          high: "{{ days[0].temperature | float(none) if days | count > 0 else none }}"
      - choose:
          - conditions: "{{ high is not none and high > states('input_number.forecast_cool_above') | float(74) }}"
            sequence:
              - action: climate.set_hvac_mode
                target: { entity_id: climate.thermostat }
                data: { hvac_mode: cool }
          - conditions: "{{ high is not none and high < states('input_number.forecast_heat_below') | float(60) }}"
            sequence:
              - action: climate.set_hvac_mode
                target: { entity_id: climate.thermostat }
                data: { hvac_mode: heat }
    mode: single

  # Cooling season: Intelligent HVAC decides the setpoint (windows, coast, pre-cool...).
  - id: ihvac_smart_cooling
    alias: Intelligent HVAC Smart Cooling
    description: Let Intelligent HVAC set the cooling setpoint from the learned model.
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: /15
    conditions:
      - condition: state
        entity_id: climate.thermostat
        state: [cool, heat_cool]
      # Only once the model has a recommendation (integration loaded + trained).
      - condition: template
        value_template: "{{ states('sensor.intelligent_hvac_recommended_cooling_setpoint') | is_number }}"
    actions:
      - action: intelligent_hvac.apply_smart_cooling_setpoint
        data: { climate_entity: climate.thermostat }
    mode: single

  # Heating season, evening: relax the setpoint, deeper setback when it is mild.
  - id: ihvac_nighttime_setback
    alias: Turn down heat at night (Dynamic Setback)
    description: Sets back the temperature at 22:00, adjusted for outdoor temperature.
    triggers:
      - trigger: time
        at: "22:00:00"
    conditions:
      - condition: state
        entity_id: climate.thermostat
        state: heat
    actions:
      - variables:
          setback: >-
            {% if is_state('binary_sensor.outdoor_temperature_below_extreme_cold_threshold', 'on') %}
              {{ states('input_number.extreme_cold_setback_temperature') | float(68) }}
            {% elif is_state('binary_sensor.outdoor_temperature_below_moderate_cold_threshold', 'on') %}
              {{ states('input_number.moderate_cold_setback_temperature') | float(67) }}
            {% else %}
              {{ states('input_number.nighttime_setback_temperature') | float(65) }}
            {% endif %}
          current: "{{ state_attr('climate.thermostat', 'temperature') | float(none) }}"
      # A setback only ever LOWERS the setpoint. If you already turned it down
      # by hand (warm day, don't want heat), raising it to the setback would
      # switch the heat on, so leave it alone.
      - condition: template
        value_template: "{{ current is none or current > setback | float }}"
      - action: climate.set_temperature
        target: { entity_id: climate.thermostat }
        data:
          temperature: "{{ setback }}"
    mode: single

  # Keep the recovery start time fresh: every 5 min plus on any input change.
  # The script itself commits (stops moving the start) once it is close.
  - id: ihvac_recovery_on_change
    alias: Update Recovery Values on Change
    description: >-
      Recompute the smart start from the live setpoint, indoor and outdoor
      temperatures. Commits 15 min before the start; never moves it into the past.
    triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: state
        entity_id:
          - sensor.intelligent_hvac_time_to_target_5degf_heat
          - input_number.target_temperature
          - input_datetime.target_wake_up_time
      - trigger: state
        entity_id: climate.thermostat
        attribute: temperature
    conditions:
      - condition: state
        entity_id: climate.thermostat
        state: heat
    actions:
      - action: script.intelligent_hvac_update_recovery
    mode: single
    max_exceeded: silent

  # The payoff: start heating exactly when the model says we must.
  - id: ihvac_morning_heat_up
    alias: "Smart Recovery: Morning Heat Up"
    description: Starts heating at the computed time so the house reaches the target at wake-up.
    triggers:
      - trigger: time
        at: input_datetime.smart_recovery_start_time
    conditions:
      - condition: state
        entity_id: climate.thermostat
        state: heat
      - condition: numeric_state
        entity_id: input_number.scaled_recovery_time
        above: 0
    actions:
      - action: climate.set_temperature
        target: { entity_id: climate.thermostat }
        data:
          temperature: "{{ states('input_number.target_temperature') | float(70) }}"
    mode: single

  # Safety net: if the smart start time has passed (plus a few minutes' grace)
  # and the setpoint still isn't up, do it now. Covers HA being down or
  # restarting at the start minute. Level-checked every 5 min, so restarts can't
  # skip it. With no start time at all it falls back to wake - fallback lead.
  - id: ihvac_fallback_heat_up
    alias: "Smart Recovery: Fallback Heat Up"
    description: >-
      Raises the setpoint to the target if the smart start time has passed and
      it is still below target before wake-up.
    triggers:
      - trigger: time_pattern
        minutes: /5
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: climate.thermostat
        state: heat
      - condition: template
        value_template: >-
          {% set w = states('input_datetime.target_wake_up_time') %}
          {% set wake = today_at(w if w not in ['unknown', 'unavailable'] else '07:00:00') %}
          {% set lead = states('input_number.fallback_recovery_lead') | float(90) %}
          {% set s = states('input_datetime.smart_recovery_start_time') %}
          {% if s in ['unknown', 'unavailable', ''] %}
            {% set start = wake - timedelta(minutes=lead) %}
          {% else %}
            {% set start = today_at(s) %}
            {# Start before midnight for an early wake-up. #}
            {% if start > wake %}{% set start = start - timedelta(days=1) %}{% endif %}
          {% endif %}
          {{ start + timedelta(minutes=5) <= now() < wake }}
      - condition: template
        value_template: >-
          {{ state_attr('climate.thermostat', 'temperature') | float(0)
             < states('input_number.target_temperature') | float(70) - 0.5 }}
    actions:
      - action: climate.set_temperature
        target: { entity_id: climate.thermostat }
        data:
          temperature: "{{ states('input_number.target_temperature') | float(70) }}"
      - action: persistent_notification.create
        data:
          notification_id: ihvac_fallback_heat_up
          title: Intelligent HVAC fallback heat-up
          message: >-
            Smart recovery hadn't raised the setpoint by {{ now().strftime('%H:%M') }},
            so the fallback did (target {{ states('input_number.target_temperature') }}°F).
            Smart start time was {{ states('input_datetime.smart_recovery_start_time') }}.
    mode: single
