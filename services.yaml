# Services for Intelligent HVAC integration
force_update:
  name: Force Update
  description: Manually trigger a data update for the thermal model
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID to update (optional, updates all if not specified)
      required: false
      selector:
        text:

apply_smart_cooling_setpoint:
  name: Apply Smart Cooling Setpoint
  description: Apply the recommended cooling setpoint to the configured climate entity
  fields:
    climate_entity:
      name: Climate Entity
      description: Human-readable climate entity to control, for example climate.thermostat
      required: false
      selector:
        entity:
          domain: climate
    entry_id:
      name: Entry ID
      description: Optional config entry ID fallback when more than one Intelligent HVAC entry exists
      required: false
      selector:
        text:
