# Intelligent HVAC dashboard. Smart Recovery view: built-in cards only. Diagnostics view: two charts need apexcharts-card (HACS).
# Requires the integration + packages/intelligent_hvac_comfort.yaml. See dashboards/README.md.
#
# Entity IDs assumed (find & replace if yours differ):
#   climate.thermostat                     your thermostat
#   sensor.intelligent_hvac_*              created by the integration
#   sensor.outdoor_temperature_most_recent created by the comfort package
title: Intelligent HVAC
views:
- title: Smart Recovery
  path: smart-recovery
  icon: mdi:thermostat
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: climate.thermostat
    name: Setpoint
    state_content: [hvac_action, temperature]
  - type: entity
    entity: sensor.intelligent_hvac_learned_indoor_temperature
    name: Indoor
  - type: entity
    entity: sensor.outdoor_temperature_most_recent
    name: Outdoor
  - type: entity
    entity: sensor.intelligent_hvac_thermal_model_confidence
    name: Confidence
  sections:

  # ── 1. Tonight ─────────────────────────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Tonight
      icon: mdi:weather-night
    - type: markdown
      content: |-
        {%- set sb = states('sensor.intelligent_hvac_night_setback') | float(states('input_number.nighttime_setback_temperature') | float(65)) -%}
        {%- set low = state_attr('sensor.intelligent_hvac_night_setback', 'overnight_low_f') -%}
        {%- set why = state_attr('sensor.intelligent_hvac_night_setback', 'reason') or 'minimum' -%}
        {%- set sp = state_attr('climate.thermostat', 'temperature') | float(none) -%}
        {%- set setback_on = is_state('automation.turn_down_heat_at_night_dynamic_setback', 'on') -%}
        {%- set heatup_on = is_state('automation.smart_recovery_morning_heat_up', 'on') -%}
        {% if not is_state('climate.thermostat', 'heat') -%}
        > ⚠️ **Thermostat is in {{ states('climate.thermostat') }}, not heat.** The setback and morning heat-up only run in heat mode.

        {% endif -%}
        **{{ states('input_datetime.setback_time')[:5] }}** · {% if setback_on %}set back to **{{ sb | int }}°F** ({{ why }}{% if low is number %}; low {{ low | round(0) | int }}°F{% endif %}){% if sp is not none and sp <= sb %}. Already at {{ sp | int }}°F, so it stays.{% endif %}{% else %}~~setback~~ off{% endif %}

        **{{ states('input_datetime.smart_recovery_start_time')[:5] }}** · {% if heatup_on %}heat up to **{{ states('input_number.target_temperature') | float(0) | round(0) | int }}°F** ({{ states('input_number.scaled_recovery_time') | float(0) | round(0) | int }} min before wake){% else %}~~heat-up~~ off{% endif %}

        **{{ states('input_datetime.target_wake_up_time')[:5] }}** · wake up warm
    - type: thermostat
      entity: climate.thermostat
    - type: gauge
      entity: input_number.current_recovery_time
      name: Per 5°F
      min: 0
      max: 300
      severity: {green: 0, yellow: 120, red: 200}
      grid_options: {columns: 4}
    - type: gauge
      entity: input_number.temperature_delta
      name: °F to gain
      min: 0
      max: 20
      severity: {green: 0, yellow: 8, red: 15}
      grid_options: {columns: 4}
    - type: gauge
      entity: input_number.scaled_recovery_time
      name: Lead used
      min: 0
      max: 300
      severity: {green: 0, yellow: 120, red: 200}
      grid_options: {columns: 4}
    - type: history-graph
      title: Last 24 hours
      hours_to_show: 24
      entities:
      - entity: climate.thermostat
        name: Thermostat
      - entity: sensor.outdoor_temperature_most_recent
        name: Outdoor
    - type: heading
      heading: Smart cooling
      icon: mdi:snowflake
    - type: markdown
      content: |-
        {% set adv = state_attr('sensor.intelligent_hvac_cooling_strategy', 'guidance_message') %}
        {{ adv or 'No cooling advice right now.' }}{% if not is_state('climate.thermostat', 'cool') %}

        *Advice only: the AC is set automatically only in cool mode, while Smart cooling is on.*{% endif %}
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.intelligent_hvac_cooling_strategy
        name: Strategy
      - entity: sensor.intelligent_hvac_recommended_cooling_setpoint
        name: Recommended setpoint
      - entity: sensor.intelligent_hvac_cooling_holding_margin
        name: Holding margin
      - entity: sensor.intelligent_hvac_pre_cool_lead_time
        name: Pre-cool lead

  # ── 2. Controls ────────────────────────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Controls
      icon: mdi:toggle-switch
    - type: button
      name: Pause
      icon: mdi:pause-circle
      icon_height: 40px
      grid_options: {columns: 6, rows: 2}
      tap_action:
        action: perform-action
        perform_action: automation.turn_off
        target:
          entity_id:
          - automation.turn_down_heat_at_night_dynamic_setback
          - automation.smart_recovery_morning_heat_up
          - automation.smart_recovery_fallback_heat_up
          - automation.set_hvac_mode_based_on_daily_forecast
          - automation.intelligent_hvac_smart_cooling
        confirmation: {text: "Stop Intelligent HVAC from changing the thermostat?"}
    - type: button
      name: Resume
      icon: mdi:play-circle
      icon_height: 40px
      grid_options: {columns: 6, rows: 2}
      tap_action:
        action: perform-action
        perform_action: automation.turn_on
        target:
          entity_id:
          - automation.turn_down_heat_at_night_dynamic_setback
          - automation.smart_recovery_morning_heat_up
          - automation.smart_recovery_fallback_heat_up
          - automation.set_hvac_mode_based_on_daily_forecast
          - automation.intelligent_hvac_smart_cooling
    - type: markdown
      content: |-
        **Pause** stops everything below from touching the thermostat until **Resume**.
        Tap a switch's icon to turn just that one on or off.

        - **Warm day, don't want heat?** Turn the thermostat down. The setback never raises it.
        - **Going away?** Pause. Turning the thermostat *off* isn't enough, because Season mode switches it back at midnight.
    - type: heading
      heading: Changes your thermostat
      heading_style: subtitle
    - type: tile
      entity: automation.turn_down_heat_at_night_dynamic_setback
      name: Setback
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: automation.smart_recovery_morning_heat_up
      name: Morning heat-up
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: automation.smart_recovery_fallback_heat_up
      name: Fallback (safety net)
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: automation.set_hvac_mode_based_on_daily_forecast
      name: Season mode · midnight
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: automation.intelligent_hvac_smart_cooling
      name: Smart cooling (summer)
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: heading
      heading: Housekeeping · leave on
      heading_style: subtitle
    - type: tile
      entity: automation.update_recovery_values_on_change
      name: Recompute on change
      grid_options: {columns: 6}
    - type: tile
      entity: automation.smart_recovery_measure_heat_up
      name: Learn from each heat-up
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: script.intelligent_hvac_update_recovery
      name: Recompute now
      icon: mdi:refresh
      grid_options: {columns: 4}
      tap_action:
        action: perform-action
        perform_action: script.intelligent_hvac_update_recovery
    - type: tile
      entity: automation.smart_recovery_morning_heat_up
      name: Heat up now
      icon: mdi:thermometer-chevron-up
      hide_state: true
      grid_options: {columns: 4}
      tap_action:
        action: perform-action
        perform_action: automation.trigger
        target: {entity_id: automation.smart_recovery_morning_heat_up}
        confirmation: {text: "Raise the thermostat to the wake-up target now?"}
      icon_tap_action: {action: none}
    - type: tile
      entity: automation.turn_down_heat_at_night_dynamic_setback
      name: Set back now
      icon: mdi:thermometer-chevron-down
      hide_state: true
      grid_options: {columns: 4}
      tap_action:
        action: perform-action
        perform_action: automation.trigger
        target: {entity_id: automation.turn_down_heat_at_night_dynamic_setback}
        confirmation: {text: "Set the thermostat back now?"}
      icon_tap_action: {action: none}

    - type: history-graph
      title: Heat up / cool down 5°F · 7 days
      hours_to_show: 168
      entities:
      - entity: sensor.intelligent_hvac_time_to_target_5degf_heat
        name: Heat up 5°F
      - entity: sensor.intelligent_hvac_time_to_target_5degf_cool
        name: Cool down 5°F

  # ── 3. Settings ────────────────────────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Settings
      icon: mdi:tune
    - type: entities
      title: Wake-up
      show_header_toggle: false
      entities:
      - entity: input_datetime.target_wake_up_time
        name: Be warm by
      - entity: input_number.target_temperature
        name: Warm to
      - entity: input_datetime.smart_recovery_start_time
        name: Heat-up starts (calculated)
      - type: section
        label: Limits on when heat-up may start
      - entity: input_number.fallback_recovery_lead
        name: At least this early (min)
      - entity: input_number.max_recovery_lead
        name: Never earlier than (min)
      - entity: input_number.recovery_time_buffer
        name: Extra buffer (min)
      - type: section
        label: Warm days
      - entity: input_boolean.ihvac_warm_day_ease_off
        name: Ease off on warm, sunny days
      - entity: sensor.intelligent_hvac_morning_target
        name: This morning's heat-up target
      - entity: input_number.ihvac_warm_day_max_ease
        name: Ease off at most (°F)
      - entity: input_number.ihvac_warm_day_check_hours
        name: Check it's warming after (h)
    - type: entities
      title: Setback
      show_header_toggle: false
      entities:
      - entity: input_datetime.setback_time
        name: Starts at
      - entity: input_number.nighttime_setback_temperature
        name: Coolest overnight
      - entity: input_number.setback_max_recovery
        name: Longest morning heat-up
      - type: section
        label: Calculated for tonight
      - entity: sensor.intelligent_hvac_night_setback
        name: Tonight's setback
      - type: attribute
        entity: sensor.intelligent_hvac_night_setback
        attribute: overnight_low_f
        name: Forecast overnight low
        icon: mdi:thermometer-low
        suffix: " °F"
      - type: attribute
        entity: sensor.intelligent_hvac_night_setback
        attribute: heat_up_from_setback_min
        name: Heat-up from setback
        icon: mdi:timer-outline
        suffix: " min"
      - type: attribute
        entity: sensor.intelligent_hvac_night_setback
        attribute: reason
        name: Why
        icon: mdi:information-outline
    - type: entities
      title: Season mode
      show_header_toggle: false
      entities:
      - entity: input_number.forecast_heat_below
        name: Heat when high below
      - entity: input_number.forecast_cool_above
        name: Cool when high above

  # ── 4. What it has learned (full width, below everything) ─────────────────
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: What it has learned
      icon: mdi:brain
    - type: horizontal-stack
      grid_options: {columns: full}
      cards:
      - type: entities
        title: Learning
        show_header_toggle: false
        entities:
        - entity: sensor.intelligent_hvac_thermal_model_status
          name: Model
        - entity: sensor.intelligent_hvac_thermal_model_confidence
          name: Confidence
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: model_last_updated
          name: Model refit
          icon: mdi:update
          format: relative
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: newest_segment_end
          name: Newest data
          icon: mdi:database-clock
          format: relative
        - type: section
          label: What it has seen
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: active_heating_segments
          name: Heat-ups
          icon: mdi:fire
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: active_cooling_segments
          name: AC runs
          icon: mdi:snowflake
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: passive_decay_segments
          name: Coasting, house cooling
          icon: mdi:home-thermometer-outline
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: passive_gain_segments
          name: Coasting, house warming
          icon: mdi:home-thermometer
      - type: entities
        title: Heating model
        show_header_toggle: false
        entities:
        - type: attribute
          entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          attribute: heating_power_f_per_hour
          name: Heating power
          icon: mdi:radiator
          suffix: " °F/h"
        - type: attribute
          entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          attribute: heat_loss_per_hour
          name: Heat loss (per °F gap)
          icon: mdi:home-export-outline
          suffix: " /h"
        - type: attribute
          entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          attribute: backtest_error_minutes
          name: Backtest error
          icon: mdi:target
          prefix: "±"
          suffix: " min"
        - type: attribute
          entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          attribute: backtest_runs
          name: Heat-ups tested
          icon: mdi:counter
        - entity: sensor.intelligent_hvac_recovery_speed_factor
          name: Real vs predicted heat-up
          icon: mdi:speedometer
        - type: attribute
          entity: sensor.intelligent_hvac_recovery_speed_factor
          attribute: samples
          name: Mornings measured
          icon: mdi:counter
        - type: section
          label: Right now
        - entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          name: Heat up 5°F
        - entity: sensor.intelligent_hvac_time_to_target_5degf_cool
          name: Cool down 5°F
        - entity: sensor.intelligent_hvac_time_to_drop_5degf_passive
          name: Drift down 5°F, HVAC off
      - type: entities
        title: Rates (HVAC on / off)
        show_header_toggle: false
        entities:
        - entity: sensor.intelligent_hvac_heating_rate_at_32degf
          name: Heating, 32°F out
        - entity: sensor.intelligent_hvac_passive_decay_rate_at_32degf
          name: Coasting, 32°F out
        - entity: sensor.intelligent_hvac_cooling_rate_at_75degf
          name: AC, 75°F out
        - entity: sensor.intelligent_hvac_passive_gain_rate_at_75degf
          name: Coasting, 75°F out

# ── Diagnostics view ─────────────────────────────────────────────────────────
# The two scatter/compare charts use apexcharts-card (HACS). Everything else is
# built-in; without apexcharts those two cards show an error and the rest works.
- title: Diagnostics
  path: diagnostics
  icon: mdi:stethoscope
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: sensor.intelligent_hvac_heating_fingerprint
    name: Fingerprint
  - type: entity
    entity: sensor.intelligent_hvac_heating_balance_point
    name: Balance point
  - type: entity
    entity: sensor.intelligent_hvac_unusual_heating_days
    name: Unusual days (30 d)
  - type: entity
    entity: sensor.intelligent_hvac_warm_up_prediction_bias
    name: Warm-up bias
  sections:

  # ── 1. Runtime vs cold ────────────────────────────────────────────────────
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Runtime vs cold
      icon: mdi:fingerprint
    - type: markdown
      content: |-
        {%- set e = 'sensor.intelligent_hvac_heating_fingerprint' -%}
        {%- set s = states(e) -%}
        {%- if s in ['unknown', 'unavailable'] -%}
        Collecting days: {{ state_attr(e, 'days_recorded') or 0 }} recorded, 10 cold days (HDD ≥ 3) needed for a fit.
        {%- else -%}
        The house uses **{{ s }} minutes of heating per degree-day** (R² {{ state_attr(e, 'r2') }}, {{ state_attr(e, 'days') }} days).
        Heating starts below about **{{ state_attr(e, 'balance_point_f') }}°F** outdoors.
        Last 60 days: {{ states('sensor.intelligent_hvac_heating_fingerprint_60_days') }} min/°F·d.
        {%- set seasons = state_attr(e, 'seasons') or {} %}
        {%- if seasons | length > 1 %}

        | Season | min/°F·d | R² | days |
        |---|---|---|---|
        {%- for k, v in seasons.items() %}
        | {{ k }} | {{ v.slope }} | {{ v.r2 }} | {{ v.days }} |
        {%- endfor %}
        {%- endif %}
        {%- endif %}
    - type: custom:apexcharts-card
      header:
        show: true
        title: Daily heating minutes vs heating degree days
        show_states: false
      graph_span: 400d
      chart_type: line
      apex_config:
        chart: { height: 320, zoom: { enabled: false } }
        xaxis:
          type: numeric
          tickAmount: 6
          title: { text: Heating degree days (65°F − mean outdoor) }
          labels: { formatter: "EVAL:(v) => Math.round(v)" }
        yaxis:
          - min: 0
            title: { text: Heating minutes }
            decimalsInFloat: 0
        markers: { size: [5, 7, 0] }
        legend: { show: true }
        tooltip: { x: { formatter: "EVAL:(v) => v.toFixed(1) + ' HDD'" } }
      series:
      - entity: sensor.intelligent_hvac_heating_fingerprint
        name: Day
        type: line
        stroke_width: 0
        color: '#4f8ef7'
        data_generator: |
          return (entity.attributes.points || []).filter(p => !p.u).map(p => [p.x, p.y]);
      - entity: sensor.intelligent_hvac_heating_fingerprint
        name: Unusual day
        type: line
        stroke_width: 0
        color: '#e5484d'
        data_generator: |
          return (entity.attributes.points || []).filter(p => p.u).map(p => [p.x, p.y]);
      - entity: sensor.intelligent_hvac_heating_fingerprint
        name: Fit
        type: line
        stroke_width: 2
        color: '#a0a0a0'
        data_generator: |
          const a = entity.attributes.intercept_min, b = parseFloat(entity.state);
          if (a == null || isNaN(b)) return [];
          const xs = (entity.attributes.points || []).map(p => p.x);
          const hi = Math.max(...xs, 1), lo = Math.max(0, -a / b);
          return [[lo, 0], [hi, a + b * hi]];
    - type: statistics-graph
      title: Fingerprint over time
      chart_type: line
      period: week
      days_to_show: 730
      stat_types: [mean]
      entities:
      - entity: sensor.intelligent_hvac_heating_fingerprint
        name: All days
      - entity: sensor.intelligent_hvac_heating_fingerprint_60_days
        name: Last 60 days

  # ── 2. Yesterday & unusual days ───────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Yesterday
      icon: mdi:calendar-today
    - type: tile
      entity: sensor.intelligent_hvac_heating_minutes_yesterday
      name: Heating
    - type: tile
      entity: sensor.intelligent_hvac_heating_expected_minutes_yesterday
      name: Expected
    - type: tile
      entity: sensor.intelligent_hvac_heating_degree_days_yesterday
      name: Degree days
    - type: tile
      entity: sensor.intelligent_hvac_heating_deviation_yesterday
      name: Off the line
    - type: heading
      heading: Unusual days
      icon: mdi:alert-circle-outline
    - type: markdown
      content: |-
        {%- set d = state_attr('sensor.intelligent_hvac_unusual_heating_days', 'days') or [] -%}
        {%- if not d -%}
        Nothing unusual in the last 30 days.
        {%- else -%}
        | Day | Out °F | Heat | Expected | |
        |---|---|---|---|---|
        {%- for x in d | reverse %}
        | {{ as_datetime(x.day).strftime('%a %b %-d') }} | {{ x.mean_outdoor | round(0) }} | {{ x.heat_min | round(0) }} | {{ x.expected_min | round(0) }} | {{ '🔥 more (door open? furnace struggling?)' if x.direction == 'more_heat' else '❄️ less (heat off? away?)' }} |
        {%- endfor %}
        {%- endif %}
    - type: history-graph
      title: Heating minutes, actual vs expected
      hours_to_show: 720
      entities:
      - entity: sensor.intelligent_hvac_heating_minutes_yesterday
        name: Actual
      - entity: sensor.intelligent_hvac_heating_expected_minutes_yesterday
        name: Expected

  # ── 3. Warm days ──────────────────────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Warm days
      icon: mdi:weather-sunny
    - type: markdown
      content: |-
        {%- set e = 'sensor.intelligent_hvac_expected_indoor_peak' -%}
        {%- set mt = states('sensor.intelligent_hvac_morning_target') -%}
        {%- set full = states('input_number.target_temperature') -%}
        {%- if states(e) in ['unknown', 'unavailable'] -%}
        Learning how warm the house gets on its own (8 days with an outdoor high needed).
        {%- else -%}
        Forecast {{ state_attr(e, 'forecast_high_f') | round(0) }}°F, {{ state_attr(e, 'condition') or 'unknown sky' }}:
        the house should reach about **{{ states(e) }}°F** on its own (± {{ state_attr(e, 'error_f') }}°F).
        Tomorrow: {{ state_attr(e, 'tomorrow_forecast_high_f') | round(0) }}°F {{ state_attr(e, 'tomorrow_condition') }}, ≈ {{ state_attr(e, 'tomorrow_indoor_peak_f') }}°F indoors.

        {% if not is_state('input_boolean.ihvac_warm_day_ease_off', 'on') -%}
        Ease-off is **off**: mornings heat to {{ full }}°F.
        {%- elif mt | float(0) < full | float(0) -%}
        Morning heat-up ({{ state_attr('sensor.intelligent_hvac_morning_target', 'for_day') }}) aims for **{{ mt }}°F** instead of {{ full }}°F, and tops up if the day doesn't warm the house.
        {%- else -%}
        Morning heat-up aims for the full {{ full }}°F.
        {%- endif %}

        Learned: peak ≈ {{ state_attr(e, 'intercept') }} + {{ state_attr(e, 'slope') }} × outdoor high (R² {{ state_attr(e, 'r2') }}, {{ state_attr(e, 'days') }} days).
        {%- endif %}
    - type: tile
      entity: sensor.intelligent_hvac_indoor_peak_yesterday
      name: Peak yesterday
    - type: tile
      entity: sensor.intelligent_hvac_indoor_peak_yesterday_predicted
      name: Predicted
    - type: history-graph
      title: Indoor peak, actual vs predicted
      hours_to_show: 720
      entities:
      - entity: sensor.intelligent_hvac_indoor_peak_yesterday
        name: Actual
      - entity: sensor.intelligent_hvac_indoor_peak_yesterday_predicted
        name: Predicted
      - entity: sensor.intelligent_hvac_morning_target
        name: Morning target

  # ── 4. Warm-up accuracy ───────────────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Predicted vs actual warm-up
      icon: mdi:timer-check-outline
    - type: markdown
      content: |-
        {%- set e = 'sensor.intelligent_hvac_warm_up_prediction_bias' -%}
        {%- set v = state_attr(e, 'verdict') -%}
        {%- set n = state_attr(e, 'runs') or 0 -%}
        {%- if n == 0 -%}
        No measured heat-ups yet. Each morning heat-up of 3°F or more is logged here.
        {%- else -%}
        {%- set msg = {'on_track': '✅ On track', 'runs_late': '⚠️ Heat-ups take longer than predicted: the start is too late', 'runs_early': '⚠️ Heat-ups are faster than predicted: the start is too early', 'learning': '⏳ Learning (5 runs needed)'} -%}
        **{{ msg.get(v, v) }}**. Over the last {{ n }} runs heat-ups averaged
        {{ states(e) }} min {{ 'longer' if states(e) | float(0) >= 0 else 'shorter' }} than predicted,
        typically off by {{ states('sensor.intelligent_hvac_warm_up_prediction_error') }} min.
        {%- endif %}
    - type: custom:apexcharts-card
      header:
        show: true
        title: Each heat-up, predicted vs actual
        show_states: false
      graph_span: 30d
      apex_config:
        chart: { height: 260 }
        markers: { size: 5 }
        yaxis: [{ min: 0, title: { text: minutes }, decimalsInFloat: 0 }]
      series:
      - entity: sensor.intelligent_hvac_warm_up_prediction_bias
        name: Predicted
        stroke_width: 0
        color: '#a0a0a0'
        data_generator: |
          return (entity.attributes.log || []).map(r => [new Date(r.ts).getTime(), r.predicted_min]);
      - entity: sensor.intelligent_hvac_warm_up_prediction_bias
        name: Actual
        stroke_width: 0
        color: '#f7a64f'
        data_generator: |
          return (entity.attributes.log || []).map(r => [new Date(r.ts).getTime(), r.actual_min]);
    - type: markdown
      content: |-
        {%- set log = state_attr('sensor.intelligent_hvac_warm_up_prediction_bias', 'log') or [] -%}
        {%- if log -%}
        | Morning | Out °F | Predicted | Actual | Off by |
        |---|---|---|---|---|
        {%- for r in (log | reverse | list)[:10] %}
        | {{ as_datetime(r.ts) | as_local | as_timestamp | timestamp_custom('%a %b %-d %H:%M') }} | {{ r.outdoor_f if r.outdoor_f is defined else '' }} | {{ r.predicted_min | round(0) }} | {{ r.actual_min | round(0) }} | {{ '%+d' | format(r.error_min | round(0) | int) }} |
        {%- endfor %}
        {%- endif %}
    - type: statistics-graph
      title: Warm-up error over time
      chart_type: line
      period: day
      days_to_show: 120
      stat_types: [mean]
      entities:
      - entity: sensor.intelligent_hvac_warm_up_last_error
        name: Each run
      - entity: sensor.intelligent_hvac_warm_up_prediction_bias
        name: Bias (recent runs)
