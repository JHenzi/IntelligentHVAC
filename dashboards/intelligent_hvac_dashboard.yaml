# Intelligent HVAC dashboard — built-in cards only (no HACS cards needed).
# Requires the integration + packages/intelligent_hvac_comfort.yaml. See dashboards/README.md.
#
# Entity IDs assumed (find & replace if yours differ):
#   climate.thermostat                     your thermostat
#   sensor.intelligent_hvac_*              created by the integration
#   sensor.outdoor_temperature_most_recent created by the comfort package
title: Intelligent HVAC
views:
- title: Smart Recovery
  path: smart-recovery
  icon: mdi:thermostat
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: climate.thermostat
    name: Setpoint
    state_content: [hvac_action, temperature]
  - type: entity
    entity: sensor.intelligent_hvac_learned_indoor_temperature
    name: Indoor
  - type: entity
    entity: sensor.outdoor_temperature_most_recent
    name: Outdoor
  - type: entity
    entity: sensor.intelligent_hvac_thermal_model_confidence
    name: Confidence
  sections:

  # ── 1. Tonight ─────────────────────────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Tonight
      icon: mdi:weather-night
    - type: markdown
      content: |-
        {%- set out = states('sensor.outdoor_temperature_most_recent') | float(50) -%}
        {%- if out < states('input_number.extreme_cold_threshold') | float(15) -%}
          {%- set sb = states('input_number.extreme_cold_setback_temperature') | float(68) -%}{%- set why = 'extreme cold' -%}
        {%- elif out < states('input_number.moderate_cold_threshold') | float(32) -%}
          {%- set sb = states('input_number.moderate_cold_setback_temperature') | float(67) -%}{%- set why = 'moderate cold' -%}
        {%- else -%}
          {%- set sb = states('input_number.nighttime_setback_temperature') | float(65) -%}{%- set why = 'normal' -%}
        {%- endif -%}
        {%- set sp = state_attr('climate.thermostat', 'temperature') | float(none) -%}
        {%- set setback_on = is_state('automation.turn_down_heat_at_night_dynamic_setback', 'on') -%}
        {%- set heatup_on = is_state('automation.smart_recovery_morning_heat_up', 'on') -%}
        {% if not is_state('climate.thermostat', 'heat') -%}
        > ⚠️ **Thermostat is in {{ states('climate.thermostat') }}, not heat.** The setback and morning heat-up only run in heat mode.

        {% endif -%}
        **22:00** · {% if setback_on %}set back to **{{ sb | int }}°F** ({{ why }}, {{ out | round(0) | int }}°F outside){% if sp is not none and sp <= sb %}. Already at {{ sp | int }}°F, so it stays.{% endif %}{% else %}~~setback~~ off{% endif %}

        **{{ states('input_datetime.smart_recovery_start_time')[:5] }}** · {% if heatup_on %}heat up to **{{ states('input_number.target_temperature') | float(0) | round(0) | int }}°F** ({{ states('input_number.scaled_recovery_time') | float(0) | round(0) | int }} min before wake){% else %}~~heat-up~~ off{% endif %}

        **{{ states('input_datetime.target_wake_up_time')[:5] }}** · wake up warm
    - type: thermostat
      entity: climate.thermostat
    - type: gauge
      entity: input_number.current_recovery_time
      name: Per 5°F
      min: 0
      max: 300
      severity: {green: 0, yellow: 120, red: 200}
      grid_options: {columns: 4}
    - type: gauge
      entity: input_number.temperature_delta
      name: °F to gain
      min: 0
      max: 20
      severity: {green: 0, yellow: 8, red: 15}
      grid_options: {columns: 4}
    - type: gauge
      entity: input_number.scaled_recovery_time
      name: Lead used
      min: 0
      max: 300
      severity: {green: 0, yellow: 120, red: 200}
      grid_options: {columns: 4}
    - type: history-graph
      title: Last 24 hours
      hours_to_show: 24
      entities:
      - entity: climate.thermostat
        name: Thermostat
      - entity: sensor.outdoor_temperature_most_recent
        name: Outdoor
    - type: heading
      heading: Smart cooling
      icon: mdi:snowflake
    - type: markdown
      content: |-
        {% set adv = state_attr('sensor.intelligent_hvac_cooling_strategy', 'guidance_message') %}
        {{ adv or 'No cooling advice right now.' }}{% if not is_state('climate.thermostat', 'cool') %}

        *Advice only: the AC is set automatically only in cool mode, while Smart cooling is on.*{% endif %}
    - type: entities
      show_header_toggle: false
      entities:
      - entity: sensor.intelligent_hvac_cooling_strategy
        name: Strategy
      - entity: sensor.intelligent_hvac_recommended_cooling_setpoint
        name: Recommended setpoint
      - entity: sensor.intelligent_hvac_cooling_holding_margin
        name: Holding margin
      - entity: sensor.intelligent_hvac_pre_cool_lead_time
        name: Pre-cool lead

  # ── 2. Controls ────────────────────────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Controls
      icon: mdi:toggle-switch
    - type: button
      name: Pause
      icon: mdi:pause-circle
      icon_height: 40px
      grid_options: {columns: 6, rows: 2}
      tap_action:
        action: perform-action
        perform_action: automation.turn_off
        target:
          entity_id:
          - automation.turn_down_heat_at_night_dynamic_setback
          - automation.smart_recovery_morning_heat_up
          - automation.smart_recovery_fallback_heat_up
          - automation.set_hvac_mode_based_on_daily_forecast
          - automation.intelligent_hvac_smart_cooling
        confirmation: {text: "Stop Intelligent HVAC from changing the thermostat?"}
    - type: button
      name: Resume
      icon: mdi:play-circle
      icon_height: 40px
      grid_options: {columns: 6, rows: 2}
      tap_action:
        action: perform-action
        perform_action: automation.turn_on
        target:
          entity_id:
          - automation.turn_down_heat_at_night_dynamic_setback
          - automation.smart_recovery_morning_heat_up
          - automation.smart_recovery_fallback_heat_up
          - automation.set_hvac_mode_based_on_daily_forecast
          - automation.intelligent_hvac_smart_cooling
    - type: markdown
      content: |-
        **Pause** stops everything below from touching the thermostat until **Resume**.
        Tap a switch's icon to turn just that one on or off.

        - **Warm day, don't want heat?** Turn the thermostat down. The setback never raises it.
        - **Going away?** Pause. Turning the thermostat *off* isn't enough, because Season mode switches it back at midnight.
    - type: heading
      heading: Changes your thermostat
      heading_style: subtitle
    - type: tile
      entity: automation.turn_down_heat_at_night_dynamic_setback
      name: Setback · 22:00
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: automation.smart_recovery_morning_heat_up
      name: Morning heat-up
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: automation.smart_recovery_fallback_heat_up
      name: Fallback (safety net)
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: automation.set_hvac_mode_based_on_daily_forecast
      name: Season mode · midnight
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: tile
      entity: automation.intelligent_hvac_smart_cooling
      name: Smart cooling (summer)
      state_content: [state, last_triggered]
      grid_options: {columns: 6}
    - type: heading
      heading: Housekeeping · leave on
      heading_style: subtitle
    - type: tile
      entity: automation.update_smart_recovery_start_time_daily
      name: Recompute at midnight
      grid_options: {columns: 6}
    - type: tile
      entity: automation.update_recovery_values_on_change
      name: Recompute on change
      grid_options: {columns: 6}
    - type: tile
      entity: script.intelligent_hvac_update_recovery
      name: Recompute now
      icon: mdi:refresh
      grid_options: {columns: 4}
      tap_action:
        action: perform-action
        perform_action: script.intelligent_hvac_update_recovery
    - type: tile
      entity: automation.smart_recovery_morning_heat_up
      name: Heat up now
      icon: mdi:thermometer-chevron-up
      hide_state: true
      grid_options: {columns: 4}
      tap_action:
        action: perform-action
        perform_action: automation.trigger
        target: {entity_id: automation.smart_recovery_morning_heat_up}
        confirmation: {text: "Raise the thermostat to the wake-up target now?"}
      icon_tap_action: {action: none}
    - type: tile
      entity: automation.turn_down_heat_at_night_dynamic_setback
      name: Set back now
      icon: mdi:thermometer-chevron-down
      hide_state: true
      grid_options: {columns: 4}
      tap_action:
        action: perform-action
        perform_action: automation.trigger
        target: {entity_id: automation.turn_down_heat_at_night_dynamic_setback}
        confirmation: {text: "Set the thermostat back now?"}
      icon_tap_action: {action: none}

    - type: history-graph
      title: Heat up / cool down 5°F · 7 days
      hours_to_show: 168
      entities:
      - entity: sensor.intelligent_hvac_time_to_target_5degf_heat
        name: Heat up 5°F
      - entity: sensor.intelligent_hvac_time_to_target_5degf_cool
        name: Cool down 5°F

  # ── 3. Settings ────────────────────────────────────────────────────────────
  - type: grid
    cards:
    - type: heading
      heading: Settings
      icon: mdi:tune
    - type: entities
      title: Wake-up
      show_header_toggle: false
      entities:
      - entity: input_datetime.target_wake_up_time
        name: Be warm by
      - entity: input_number.target_temperature
        name: Warm to
      - entity: input_datetime.smart_recovery_start_time
        name: Heat-up starts (calculated)
      - type: section
        label: Limits on when heat-up may start
      - entity: input_number.fallback_recovery_lead
        name: At least this early (min)
      - entity: input_number.max_recovery_lead
        name: Never earlier than (min)
      - entity: input_number.recovery_time_buffer
        name: Extra buffer (min)
    - type: entities
      title: Setback
      show_header_toggle: false
      entities:
      - entity: input_number.nighttime_setback_temperature
        name: Normal night
      - entity: input_number.moderate_cold_setback_temperature
        name: Cold night
      - entity: input_number.extreme_cold_setback_temperature
        name: Very cold night
      - type: section
        label: What counts as cold (outdoor)
      - entity: input_number.moderate_cold_threshold
        name: Cold below
      - entity: input_number.extreme_cold_threshold
        name: Very cold below
    - type: entities
      title: Season mode
      show_header_toggle: false
      entities:
      - entity: input_number.forecast_heat_below
        name: Heat when high below
      - entity: input_number.forecast_cool_above
        name: Cool when high above

  # ── 4. What it has learned (full width, below everything) ─────────────────
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: What it has learned
      icon: mdi:brain
    - type: horizontal-stack
      grid_options: {columns: full}
      cards:
      - type: entities
        title: Learning
        show_header_toggle: false
        entities:
        - entity: sensor.intelligent_hvac_thermal_model_status
          name: Model
        - entity: sensor.intelligent_hvac_thermal_model_confidence
          name: Confidence
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: model_last_updated
          name: Model refit
          icon: mdi:update
          format: relative
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: newest_segment_end
          name: Newest data
          icon: mdi:database-clock
          format: relative
        - type: section
          label: What it has seen
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: active_heating_segments
          name: Heat-ups
          icon: mdi:fire
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: active_cooling_segments
          name: AC runs
          icon: mdi:snowflake
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: passive_decay_segments
          name: Coasting, house cooling
          icon: mdi:home-thermometer-outline
        - type: attribute
          entity: sensor.intelligent_hvac_thermal_model_status
          attribute: passive_gain_segments
          name: Coasting, house warming
          icon: mdi:home-thermometer
      - type: entities
        title: Heating model
        show_header_toggle: false
        entities:
        - type: attribute
          entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          attribute: heating_power_f_per_hour
          name: Heating power
          icon: mdi:radiator
          suffix: " °F/h"
        - type: attribute
          entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          attribute: heat_loss_per_hour
          name: Heat loss (per °F gap)
          icon: mdi:home-export-outline
          suffix: " /h"
        - type: attribute
          entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          attribute: backtest_error_minutes
          name: Backtest error
          icon: mdi:target
          prefix: "±"
          suffix: " min"
        - type: attribute
          entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          attribute: backtest_runs
          name: Heat-ups tested
          icon: mdi:counter
        - type: section
          label: Right now
        - entity: sensor.intelligent_hvac_time_to_target_5degf_heat
          name: Heat up 5°F
        - entity: sensor.intelligent_hvac_time_to_target_5degf_cool
          name: Cool down 5°F
        - entity: sensor.intelligent_hvac_time_to_drop_5degf_passive
          name: Drift down 5°F, HVAC off
      - type: entities
        title: Rates (HVAC on / off)
        show_header_toggle: false
        entities:
        - entity: sensor.intelligent_hvac_heating_rate_at_32degf
          name: Heating, 32°F out
        - entity: sensor.intelligent_hvac_passive_decay_rate_at_32degf
          name: Coasting, 32°F out
        - entity: sensor.intelligent_hvac_cooling_rate_at_75degf
          name: AC, 75°F out
        - entity: sensor.intelligent_hvac_passive_gain_rate_at_75degf
          name: Coasting, 75°F out
