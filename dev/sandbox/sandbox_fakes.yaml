# Sliders that stand in for real-world inputs, so the comfort package can be
# exercised on demand: drag a slider, watch the script/automations react.
input_number:
  sandbox_outdoor_temp:
    name: "Sandbox: Outdoor Temp"
    min: -20
    max: 110
    step: 1
    unit_of_measurement: "°F"
  sandbox_time_to_target_heat:
    name: "Sandbox: Time to Target 5°F Heat"
    min: 0
    max: 400
    step: 0.1
    unit_of_measurement: min
  sandbox_heat_loss:
    name: "Sandbox: Heat Loss per Hour"
    min: 0
    max: 1
    step: 0.001
  sandbox_heating_power:
    name: "Sandbox: Heating Power °F/h"
    min: 0
    max: 30
    step: 0.01
  sandbox_indoor_temp:
    name: "Sandbox: Indoor Temp"
    min: 40
    max: 90
    step: 0.1
    unit_of_measurement: "°F"
  sandbox_indoor_trend:
    name: "Sandbox: Indoor Trend °F/h"
    min: -10
    max: 10
    step: 0.01

template:
  - sensor:
      - name: Sandbox Outdoor Temperature
        unique_id: sandbox_outdoor_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.sandbox_outdoor_temp') }}"
      - name: Sandbox Time To Target Heat
        unique_id: sandbox_time_to_target_heat
        unit_of_measurement: min
        state: "{{ states('input_number.sandbox_time_to_target_heat') }}"
        attributes:
          heat_loss_per_hour: "{{ states('input_number.sandbox_heat_loss') | float(0) }}"
          heating_power_f_per_hour: "{{ states('input_number.sandbox_heating_power') | float(0) }}"
      - name: Sandbox Indoor Temperature
        unique_id: sandbox_indoor_temperature
        unit_of_measurement: "°F"
        state: "{{ states('input_number.sandbox_indoor_temp') }}"
      - name: Sandbox Indoor Trend
        unique_id: sandbox_indoor_trend
        state: "{{ states('input_number.sandbox_indoor_trend') }}"
